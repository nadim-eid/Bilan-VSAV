name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Enable immersive fullscreen
        run: |
          python3 - <<'PY'
          path = "android/app/src/main/java/fr/bilanvsav/app/MainActivity.java"

          content = """package fr.bilanvsav.app;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }
          }
          """

          with open(path, "w") as f:
              f.write(content)
          PY

      - name: Add flashlight permission
        run: |
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"

          with open(path) as f:
              content = f.read()

          if "android.permission.FLASHLIGHT" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.FLASHLIGHT"/>\n    <application',
                  1,
              )

          with open(path, "w") as f:
              f.write(content)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilan-VSAV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
